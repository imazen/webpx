[workspace]
members = [".", "examples-crates/zencodec-swap-demo"]
resolver = "2"
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and CI never compile it or run rustdoc. Regenerate via
# `just api-doc` (cargo test --manifest-path apidoc/Cargo.toml).
exclude = ["apidoc"]

[package]
name = "webpx"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Complete WebP encoding/decoding with ICC profiles, streaming, and animation support"
repository = "https://github.com/imazen/webpx"
keywords = ["webp", "image", "codec", "icc", "animation"]
categories = ["multimedia::images", "multimedia::encoding"]
exclude = [
    ".github/",
    ".gitignore",
    "CLAUDE.md",
    "justfile",
    "docs/",
    "tests/",
    "benches/",
]

# The enforcement-matrix docs link feature-gated items (StreamingDecoder,
# AnimationDecoder); docs.rs must build with every feature so those links
# resolve, matching CI's `cargo doc --all-features`.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["decode", "encode", "std"]
std = ["libwebp-sys/std"]
decode = []
encode = []
animation = []
icc = []              # ICC profile support (requires mux)
streaming = []        # Incremental decode/encode
# zencodec trait integration. Mirrors zenwebp's `pub mod zencodec`
# surface so the same caller code works against either crate.
zencodec = ["dep:zencodec", "dep:zenpixels", "decode", "encode", "std"]

[dependencies]
libwebp-sys = "0.14.2"
rgb = "0.8.53"
imgref = "1.12.0"
enough = "0.4.2"
whereat = "0.1.4"
# Pinned to the same versions zenwebp uses so trait impls land on the
# same `zencodec` semver line; users who swap crates don't have to
# upgrade their `zencodec` consumer.
zencodec = { version = "0.1.13", optional = true, default-features = false }
zenpixels = { version = "0.2.10", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
image = "0.25"
# Same major as fuzz/Cargo.toml: the fuzz_regression harness re-decodes
# structured fuzz seeds (fuzz/regression/limits_boundaries-*) with the
# exact `Arbitrary` layout the fuzz targets used to produce them.
arbitrary = { version = "1.4.2", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = { version = "0.8", features = ["rayon"] }

[[bench]]
name = "codec"
harness = false
required-features = ["animation"]

[[bench]]
name = "profile"
harness = false
required-features = ["animation", "streaming"]

[[example]]
name = "alloc_profile"
required-features = ["animation", "streaming", "decode", "encode"]

[[example]]
name = "pixel_api_demo"
required-features = ["animation", "encode"]

[[example]]
name = "decode_with_limits"
required-features = ["decode", "encode", "animation", "icc"]

[[example]]
name = "quick_encode"
required-features = ["encode"]

[[example]]
name = "quick_encode_lossless"
required-features = ["encode"]

[[example]]
name = "real_image_test"
required-features = ["encode"]

[[example]]
name = "wasm_demo"
required-features = ["encode", "decode"]

[[example]]
name = "mem_formula"
required-features = ["encode", "decode"]

[[example]]
name = "leak_test"
required-features = ["encode", "decode", "streaming", "animation", "icc"]

[[example]]
name = "zencodec_swap"
required-features = ["zencodec"]
